name: Publish alpha installer
on:
  push:
    branches: [main]
    paths: [module.json, '.github/workflows/publish.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: devils-table-installer
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'devilclarke42/DevilsTable' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Validate and package
        run: npm run package
      - name: Publish and verify versioned alpha assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/publish-release.mjs
